<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lattice feedback</title>
<style>
:root{font:16px system-ui;color:#202a33;background:#f4f6f8}*{box-sizing:border-box}body{margin:0}header{background:#182c3c;color:white;padding:20px 28px}header h1{margin:0;font-size:1.5rem}header p{margin:5px 0 0;color:#bbd0de}.layout{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:calc(100vh - 88px)}aside{background:white;border-right:1px solid #dbe2e8;padding:20px}main{padding:24px;max-width:1100px;width:100%;margin:auto}label{display:block;font-weight:600;margin:12px 0 5px}input,textarea,select{font:inherit;border:1px solid #b9c6cf;border-radius:8px;padding:10px;width:100%;background:white}textarea{min-height:100px;resize:vertical}button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:10px 14px;background:#dce8ee;color:#193447}button:hover{filter:brightness(.96)}button:disabled{opacity:.5;cursor:default}.episode{display:block;width:100%;text-align:left;margin:8px 0;background:#f2f6f8}.episode[aria-current=true],.tabs button[aria-current=true]{background:#176b86;color:white}.muted{color:#627482;font-size:.9rem}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.panel{background:white;border:1px solid #dce4e9;border-radius:12px;padding:20px;margin:16px 0}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button{background:#e5edf1}.artifact{white-space:pre-wrap;overflow-wrap:anywhere;background:#f7f9fa;padding:16px;border-radius:8px;max-height:560px;overflow:auto}video{width:100%;max-height:500px;background:#0c1720;border-radius:8px}.primary{background:#176b86;color:white}.approve{background:#27845d;color:white}.reject{background:#b84a4a;color:white}.history{border-top:1px solid #e1e7ea;padding:10px 0}.error{color:#a52727}.success{color:#21764e}@media(max-width:720px){.layout{display:block}aside{border-right:0;border-bottom:1px solid #dbe2e8}main{padding:16px}}
</style>
<header><h1>Lattice feedback</h1><p>Review generated lessons, video scripts, and videos</p></header>
<div class="layout"><aside><label for="token">Bearer token</label><input id="token" type="password" autocomplete="off" placeholder="If required"><p class="muted">Kept in memory only.</p><label for="filter">Show</label><select id="filter"><option value="all">All episodes</option><option value="awaiting_review">Waiting for review</option><option value="processing">Processing</option><option value="approved">Approved</option><option value="rejected">Rejected</option></select><p id="count" class="muted"></p><nav id="queue" aria-label="Episodes"></nav></aside>
<main><p id="status" role="status">Loading episodes...</p><div id="detail" hidden><h2 id="title"></h2><p id="meta" class="muted"></p><div class="tabs" id="tabs" role="tablist"></div><section class="panel" id="preview"></section><section class="panel"><h3>Leave feedback</h3><p class="muted" id="feedback-context"></p><label for="comment">Comment</label><textarea id="comment" placeholder="What should change?" required></textarea><div id="timestamp-wrap" hidden><label for="timestamp">Video time (seconds, optional)</label><input id="timestamp" type="number" min="0" step="1"></div><p><button class="primary" id="save">Save feedback</button></p><p id="save-status" role="status"></p></section><section class="panel"><h3>Feedback history</h3><div id="history"></div></section><section class="panel" id="decision-panel"><h3>Final video decision</h3><p class="muted">Approve or reject a completed video. Rejection returns it for another revision.</p><label for="criteria">Reject criteria (comma separated)</label><input id="criteria" placeholder="visual_clarity, pacing"><label for="decision-feedback">Decision notes</label><textarea id="decision-feedback" placeholder="Reason for rejection or approval"></textarea><div class="row"><button class="approve" id="approve">Approve</button><button class="reject" id="reject">Reject</button></div><p id="decision-status" role="status"></p></section></div></main></div>
<script>
let episodes=[],item=null,kind='lesson',videoUrl='';
const $=id=>document.getElementById(id);
function headers(){const token=$('token').value.trim();return token?{'Authorization':'Bearer '+token}:{}}
async function api(path,options={}){const r=await fetch(path,{...options,headers:{...headers(),...(options.headers||{})}});if(!r.ok){let message='Request failed ('+r.status+').';try{message=(await r.json()).error||message}catch{}throw Error(message)}return r.json()}
async function load(){try{const previous=item?.id;episodes=await api('/episodes');await api('/review-queue');item=episodes.find(x=>x.id===previous)||episodes[0]||null;renderList();await show()}catch(e){$('status').textContent=e.message;$('status').className='error'}}
function renderList(){const visible=episodes.filter(x=>$('filter').value==='all'||x.status===$('filter').value);$('count').textContent=visible.length+' episode'+(visible.length===1?'':'s');$('queue').replaceChildren();for(const entry of visible){const b=document.createElement('button');b.className='episode';b.textContent=entry.topic+' · '+entry.status.replaceAll('_',' ')+' · r'+entry.revision;b.setAttribute('aria-current',String(item?.id===entry.id));b.onclick=async()=>{item=entry;kind='lesson';renderList();await show()};$('queue').append(b)}}
async function show(){if(videoUrl){URL.revokeObjectURL(videoUrl);videoUrl=''}$('detail').hidden=!item;if(!item){$('status').textContent='No episodes yet.';return}$('status').textContent='';$('title').textContent=item.topic;$('meta').textContent=item.subject_area+' · '+item.status.replaceAll('_',' ')+' · revision '+item.revision;$('decision-panel').hidden=item.status!=='awaiting_review';const tabs=$('tabs');tabs.replaceChildren();for(const name of ['lesson','script','video']){const b=document.createElement('button');b.textContent=name==='script'?'Video script':name[0].toUpperCase()+name.slice(1);b.setAttribute('role','tab');b.setAttribute('aria-current',String(kind===name));b.onclick=async()=>{kind=name;await show()};tabs.append(b)}$('feedback-context').textContent='For '+kind+' · revision '+item.revision;$('timestamp-wrap').hidden=kind!=='video';await Promise.all([preview(),history()])}
async function preview(){const box=$('preview');box.replaceChildren();const path=item.artifacts[kind];if(!path){box.textContent='No '+kind+' artifact is available yet.';return}try{if(kind==='video'){const response=await fetch('/media/'+encodeURIComponent(item.id),{headers:headers()});if(!response.ok)throw Error('Video unavailable ('+response.status+').');videoUrl=URL.createObjectURL(await response.blob());const v=document.createElement('video');v.controls=true;v.playsInline=true;v.src=videoUrl;box.append(v);const mark=document.createElement('button');mark.textContent='Use current video time';mark.onclick=()=>$('timestamp').value=Math.floor(v.currentTime||0);box.append(mark)}else{const data=await api(path);const pre=document.createElement('pre');pre.className='artifact';pre.textContent=JSON.stringify(data,null,2);box.append(pre)}}catch(e){box.textContent=e.message}}
async function history(){const box=$('history');box.replaceChildren();try{const entries=await api('/episodes/'+encodeURIComponent(item.id)+'/feedback');if(!entries.length){box.textContent='No feedback yet.';return}for(const entry of entries){const div=document.createElement('div');div.className='history';const heading=document.createElement('strong');heading.textContent=entry.kind+' · r'+entry.revision+(entry.start_seconds===null?'':' · '+entry.start_seconds+'s');const note=document.createElement('p');note.textContent=entry.comment;const meta=document.createElement('small');meta.className='muted';meta.textContent=entry.reviewer_id+' · '+new Date(entry.created_at).toLocaleString();div.append(heading,note,meta);box.append(div)}}catch(e){box.textContent=e.message}}
async function save(){const comment=$('comment').value.trim();if(!comment){$('save-status').textContent='Enter a comment first.';return}const timestamp=$('timestamp').value;try{await api('/episodes/'+encodeURIComponent(item.id)+'/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({revision:item.revision,kind,comment,reviewer_id:'owner',start_seconds:kind==='video'&&timestamp!==''?Number(timestamp):null})});$('comment').value='';$('save-status').textContent='Feedback saved.';$('save-status').className='success';await history()}catch(e){$('save-status').textContent=e.message;$('save-status').className='error'}}
async function decide(decision){const criteria=$('criteria').value.split(',').map(x=>x.trim()).filter(Boolean);const feedback=$('decision-feedback').value.trim();try{await api('/episodes/'+encodeURIComponent(item.id)+'/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({decision,reviewer_id:'owner',criteria,feedback})});$('decision-status').textContent='Decision saved.';await load()}catch(e){$('decision-status').textContent=e.message;$('decision-status').className='error'}}
$('token').addEventListener('change',load);$('filter').addEventListener('change',renderList);$('save').onclick=save;$('approve').onclick=()=>decide('approve');$('reject').onclick=()=>decide('reject');load();
</script></html>
